This project is a research project titled AZT, which is meant to bring secure mobile ad hoc network routing protocols to drones. Given the dynamic topologies of drones, aspects of previously defined routing protocols must be adjusted or changed to fit the drone paradigm. The implementation of the routing protocol is split into three main components. First and foremost, its based on SEAR a secure MANET routing protocol which incorporates Hash Trees, Hash Chain (authenticators) and TESLA, a secure route error solution. AZT intends to incoporate all components of SEAR, along with inital asymmetric authentication and group authentication. Group authentication restricts communication between nodes to follow the swarm paradigm drones typically follow. AZT protocol's asymmetric authentication process begins when UAVs receive public-key certificates from the ground control station before deployment. When joining a subswarm, each UAV must authenticate directly with the leader drone using a challenge-response protocol that involves nonces signed with the UAV's private key, preventing man-in-the-middle and replay attacks. After successful authentication, the leader distributes the Valid Certificate List and Certificate Revocation List to the new member, establishing a chain of trust that secures subsequent symmetric key operations in the routing protocol. The AZT protocol manages UAV swarm authentication through a subswarm structure where leader drones maintain Valid Certificate Lists (VCL) and authenticate members using GCS-issued certificates. Initial authentication requires asymmetric cryptography, after which leaders distribute VCLs and Certificate Revocation Lists to enable secure ad-hoc communication within the subswarm. For efficiency in highly mobile environments, AZT implements a quick re-authentication mechanism using single-use reconnection tokens that allows temporarily disconnected nodes to securely rejoin without triggering the full authentication process. Note that this code is not required to be as robust for all scenarios, and more exists as proof of concept for research code. Requests will be related to fixing or implementing features described in this excerpt.
