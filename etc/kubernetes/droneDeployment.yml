apiVersion: v1
kind: Pod
metadata:
  name: drone1
  namespace: default
  labels:
    app: drone1
    tier: drone
spec:
  hostname: drone1
  containers:
    - name: logs
      image: cyu72/drone:simulation-terminal
      imagePullPolicy: Always
      stdin: true
      tty: true
      env:
        - name: NODE_ID
          value: "1"
        - name: PORT
          value: "65456"
        - name: TESLA_DISCLOSE
          value: "10"
        - name: MAX_HOP_COUNT
          value: "25"
        - name: MAX_SEQ_COUNT
          value: "50"
        - name: CONTROLLER_ADDR
          value: "192.168.4.32"
        - name: TIMEOUT_SEC
          value: "30"
        - name: LOG_LEVEL
          value: "INFO"
        - name: GCS_IP
          value: "gcs-service.default"
        - name: DRONE_COUNT
          value: "21"
        - name: DISCOVERY_INTERVAL
          value: "360"
        - name: IS_LEADER
          value: "true"
        - name: ENABLE_LEADER
          value: "True"
        - name: TRIGGER_RERR
          value: "False"
        - name: NODE_IP
          value: "drone1-service.default"
        - name: SN
          value: "100000009e15344d"
        - name: EEPROM_ID
          value: "00005d5d9e15344d61eacbb2"
      ports:
        - name: action-port
          protocol: TCP
          containerPort: 65456
        - name: brdcst-port
          protocol: UDP
          containerPort: 65457
        - name: start-port
          protocol: TCP
          containerPort: 8080
        - name: ipc
          protocol: TCP
          containerPort: 60137

    - name: terminal
      image: cyu72/drone:latest
      imagePullPolicy: Always
      command: ["./drone_app", "--terminal"]
      stdin: true
      tty: true
      env:
        - name: ROUTING_HOST
          value: "localhost"
        - name: NODE_ID
          value: "1"
        - name: NODE_IP
          value: "drone1-service.default"
---
apiVersion: v1
kind: Service
metadata:
  name: drone1-service
spec:
  externalTrafficPolicy: Local
  type: LoadBalancer
  selector:
    app: drone1
    tier: drone
  ports:
  - name: drone-port
    protocol: TCP
    port: 65456
    targetPort: 65456
  - name: udp-test-port
    protocol: UDP
    port: 65457
    targetPort: 65457
  - name: start-port
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30001
---
